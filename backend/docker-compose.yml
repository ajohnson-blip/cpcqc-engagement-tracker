services:
  postgres:
    image: postgres:16
    container_name: cpcqc-tracker-db
    environment:
      POSTGRES_USER: cpcqc
      POSTGRES_PASSWORD: cpcqc
      POSTGRES_DB: cpcqc_tracker
    ports:
      - "5432:5432"
    volumes:
      - cpcqc-tracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpcqc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpcqc-tracker-db:
