[project]
name = "cpcqc-engagement-assessment"
version = "0.1.0"
description = "Assessment service for the CPCQC Engagement Tracker — reads REDCap, returns per-hospital-period assessments"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
